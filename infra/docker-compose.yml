services:
  api:
    build:
      # Context is the repository root: the service depends on the sanad-core
      # library, which lives outside apps/api.
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      # Optional so a fresh clone can start without a populated .env.
      - path: ../apps/api/.env
        required: false

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - SANAD_API_URL=http://api:8000
    depends_on:
      - api
